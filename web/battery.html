<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d13">
  <title>DJY · BMS 배터리</title>
  <style>
    :root{color-scheme:dark;--bg:#080d13;--card:#111b27;--line:#26384b;--muted:#98a9bd;--cyan:#52d7f0;--ok:#39df94;--bad:#ff526a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4fc;font:15px/1.5 system-ui,"Malgun Gothic",sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header,main{max-width:1000px;margin:auto}header{padding:18px 4px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}.brand,small,.muted{color:var(--muted)}.brand{font-size:11px;letter-spacing:.15em;font-weight:800}a{color:var(--cyan)}#status{font-weight:900;color:var(--bad)}#status.live{color:var(--ok)}main{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.label{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em}.value{font-size:clamp(30px,7vw,56px);font-weight:950;font-variant-numeric:tabular-nums;line-height:1.2}.unit{font-size:15px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:12px}.cell{background:#192a3a;border:1px solid #30485f;border-radius:8px;padding:9px;text-align:center;font-variant-numeric:tabular-nums}.cell b{display:block;color:var(--cyan);font-size:18px}.alarm{color:var(--ok);font-weight:900}.alarm.bad{color:var(--bad)}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.value{font-size:clamp(27px,9vw,44px)}.card{padding:12px}}
  </style>
</head>
<body>
  <header><div><div class="brand">DJY MOTORSPORT · BATTERY</div><h1>DALY BMS 상태</h1><a href="/pit">← 통합 피트 대시보드</a></div><div id="status">● BMS 미수신</div></header>
  <main>
    <section class="grid">
      <article class="card"><div class="label">PACK VOLTAGE</div><div class="value"><span id="voltage">—</span><span class="unit"> V</span></div></article>
      <article class="card"><div class="label">STATE OF CHARGE</div><div class="value"><span id="soc">—</span><span class="unit"> %</span></div></article>
      <article class="card"><div class="label">PACK CURRENT</div><div class="value"><span id="current">—</span><span class="unit"> A</span></div></article>
      <article class="card"><div class="label">PACK POWER</div><div class="value"><span id="power">—</span><span class="unit"> kW</span></div></article>
      <article class="card"><div class="label">CELL DELTA</div><div class="value"><span id="delta">—</span><span class="unit"> mV</span></div></article>
      <article class="card"><div class="label">TEMPERATURE RANGE</div><div class="value"><span id="temps">—</span><span class="unit"> °C</span></div></article>
    </section>
    <section class="card"><div class="topline"><h2>셀 전압 <small id="cellCount">대기</small></h2><small id="age">CAN 응답 대기</small></div><div id="cells" class="cells"></div></section>
    <section class="card"><h2>BMS 상태 및 알람</h2><div class="row"><span>충전 / 방전 MOS</span><b id="mos">—</b></div><div class="row"><span>충전기 / 부하</span><b id="load">—</b></div><div class="row"><span>밸런싱 · 수명 · 잔여 용량</span><b id="extra">—</b></div><div class="row"><span>충방전 사이클</span><b id="cycles">—</b></div><div class="row"><span>알람</span><b id="alarm" class="alarm">미수신</b></div><small id="source">ESP CAN · DALY R24TS · 읽기 전용</small></section>
  </main>
  <script>
    const $=id=>document.getElementById(id),fmt=(v,n=1)=>Number.isFinite(Number(v))?Number(v).toFixed(n):'—';
    async function update(){try{const r=await fetch('/api/telemetry',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),live=!!d.bms_online;$('status').textContent=live?'● BMS LIVE':'● BMS 미수신';$('status').classList.toggle('live',live);$('voltage').textContent=live?fmt(d.battery_pack_voltage_v):'—';$('soc').textContent=live?fmt(d.battery_soc_pct):'—';$('current').textContent=live?fmt(d.battery_current_a):'—';$('power').textContent=live?fmt(d.battery_power_kw,2):'—';$('delta').textContent=live?fmt(d.bms_cell_delta_mv,0):'—';$('temps').textContent=live?`${fmt(d.bms_temp_min_c,0)} / ${fmt(d.bms_temp_max_c,0)}`:'—';$('cellCount').textContent=live?`${d.bms_cell_count||0} cells`:'BMS 응답 대기';$('age').textContent=live?`CAN 수신 ${fmt(d.bms_age_ms,0)} ms 전`:'CAN 응답 대기';$('cells').replaceChildren();if(live)(d.bms_cell_voltages_v||[]).forEach((v,i)=>{const cell=document.createElement('div');cell.className='cell';cell.innerHTML=`셀 ${i+1}<b>${fmt(v,3)} V</b>`;$('cells').append(cell);});$('mos').textContent=live?`${d.bms_charge_mos_on?'충전 ON':'충전 OFF'} / ${d.bms_discharge_mos_on?'방전 ON':'방전 OFF'}`:'—';$('load').textContent=live?`${d.bms_charger_present?'충전기 연결':'충전기 없음'} / ${d.bms_load_present?'부하 연결':'부하 없음'}`:'—';$('extra').textContent=live?`${d.bms_balancing?'밸런싱 중':'밸런싱 없음'} · ${fmt(d.bms_life_pct,0)}% · ${fmt(d.bms_remaining_capacity_ah,2)} Ah`:'—';$('cycles').textContent=live?String(d.bms_cycle_count||0):'—';$('alarm').textContent=live?(d.bms_alarm_summary||'NONE'):'미수신';$('alarm').classList.toggle('bad',!!d.bms_fault);$('source').textContent=`${d.bms_model||'DALY R24TS'} · ${d.bms_protocol||'DALY CAN'} · ${d.bms_source||'ESP CAN'}`;}catch{$('status').textContent='● 게이트웨이 연결 끊김';$('status').classList.remove('live');}finally{setTimeout(update,500)}}update();
  </script>
</body>
</html>
