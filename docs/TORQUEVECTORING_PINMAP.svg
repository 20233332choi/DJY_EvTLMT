<text x="905" y="163">STM RX: GPIO18 ← PA9</text>
<text x="905" y="191">STM TX: GPIO17 → PA10</text>
<text x="905" y="219">GND 공통 · UART 115200 8N1</text>
<text x="905" y="259">BMS CAN: GPIO9 TX / GPIO8 RX</text>
<text x="905" y="288">LED: GPIO38 / PIT: GPIO4</text>
<text x="905" y="327">Wi-Fi UDP 9003 → PC</text>
