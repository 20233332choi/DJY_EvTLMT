<text class="head" x="30" y="607">STM 미수신과 연결되는 소스 차이</text>
<text x="30" y="638">① Rear PA9 → ESP GPIO18: USART1 송신 추가·적용 후 무선 TPS/IMU/TQV 수신 확인.</text>
<text x="30" y="667">② 로그가 L=… 및 TV v=… 두 줄. 현재 ESP는 TV 줄을 해석하지 않으므로 포트와 문장 계약을 함께 맞춰야 함.</text>
<text x="30" y="696">③ 기존 센서 핀맵·제어·DAC 선택 유지. USART1 텔레메트리만 추가. 명령 수신 없음.</text>
<text class="small" x="30" y="731">정확한 활성 상태·근거·다른 버전과의 차이: TORQUEVECTORING_PINMAP.md</text>
