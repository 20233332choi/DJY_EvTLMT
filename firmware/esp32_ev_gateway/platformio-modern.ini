[platformio]
default_envs = esp32-s3-devkitc-1
; Short paths avoid Windows MAX_PATH in the bundled Matter headers.
packages_dir = ${sysenv.USERPROFILE}/.p
cache_dir = ${sysenv.USERPROFILE}/.c
; The Windows Xtensa linker cannot open a map filename in the Korean project path.
build_dir = ${sysenv.USERPROFILE}/telemetry-tools/esp-build-modern

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 3000000
upload_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=0
    -D EV_REAR_UART_MODE=1
    -D EV_BMS_CAN_ENABLED=1
    -D EV_RELAY_FAST_RSA_TLS=1
